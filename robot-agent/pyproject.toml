[project]
name = "robot-agent"
version = "0.1.0"
description = "LLM agent loop that controls the LEGO kör TanfolyamRobot through tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.36.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
